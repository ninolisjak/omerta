<section
  class="city-map"
  [class.expanded]="expanded()"
  aria-label="Interactive district map of Blackwater"
>
  <header class="map-top">
    <div>
      <span class="map-kicker">DISTRICT 01</span>
      <h3>Blackwater</h3>
      <span class="map-sub">A city that never tells.</span>
    </div>
    <span class="weather"
      ><o-icon name="rain" />11°<i></i
      ><span class="weather-label">LIGHT RAIN</span></span
    >
  </header>
  <div class="map-viewport">
    <div class="map-world" [style.transform]="'scale(' + zoom() + ')'">
      <div
        class="city-art"
        role="img"
        aria-label="Black-and-white, top-down pixel-art map of 1930s Blackwater: neighborhood streets, City Hall, warehouses, and a working harbor"
      ></div>
      @for (district of districts; track district.id) {
        <button
          class="district-pin"
          [class.home]="district.id === 'italy'"
          [class.active]="selected() === district.id"
          [style.left.%]="district.x"
          [style.top.%]="district.y"
          (click)="selected.set(district.id)"
          [attr.aria-label]="district.name + ': ' + district.type"
          [attr.aria-pressed]="selected() === district.id"
        >
          <span class="pin-symbol"><o-icon [name]="district.icon" /></span>
          <span class="pin-name">{{ district.name }}</span>
          @if (district.id === "italy") {
            <span class="pin-sub">YOUR BLOCK</span>
          }
        </button>
      }
    </div>
  </div>
  <div class="district-card">
    <div class="district-meta">
      <span class="status-dot"></span>{{ district().type }}
    </div>
    <h4>{{ district().name }}</h4>
    <p>{{ district().description }}</p>
    <button (click)="navigate.emit(district().view)">
      {{ district().action }}<o-icon name="arrow" />
    </button>
  </div>
  <div class="map-bottom">
    <div class="legend">
      <span><i class="own"></i>Your block</span
      ><span><i class="rival"></i>Rivals</span
      ><span><i></i>City districts</span>
    </div>
    <div class="map-controls">
      <button
        aria-label="Zoom out"
        [disabled]="zoom() === 1"
        (click)="changeZoom(-0.1)"
      >
        <o-icon name="minus" />
      </button>
      <span>{{ (zoom() * 100).toFixed(0) }}%</span>
      <button
        aria-label="Zoom in"
        [disabled]="zoom() === 1.5"
        (click)="changeZoom(0.1)"
      >
        <o-icon name="plus" />
      </button>
      <button
        aria-label="Reset map zoom"
        (click)="zoom.set(1)"
        class="reset-zoom"
      >
        <o-icon name="expand" />
      </button>
    </div>
  </div>
</section>
